<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ano a Ano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabeçalho com avatar e saldo, diário de anos no meio, doca fixa embaixo com navegação, botão "+ Idade" e atributos; painéis em tela cheia por cima */
:root {
  --paper: #EDF0F5; --card: #FFFFFF; --ink: #17223A; --muted: #5A6681; --line: #D8DDE8; --band: #6B7488; --band-ink: #FFFFFF;
  --accent: #1F4FD1; --accent-ink: #FFFFFF; --sun: #F4B62C; --sun-ink: #1E1A0E;
  --good: #23885A; --warn: #C27D0E; --bad: #C6303B; --scrim: rgba(12, 18, 32, .5);
  --c-vida: #8A94A8; --c-familia: #8452C9; --c-escola: #2B7FD9; --c-amor: #D3457B; --c-saude: #23885A;
  --c-dinheiro: #C2920E; --c-trabalho: #4F6F8F; --c-fama: #E0662B; --c-crime: #33363D; --c-infancia: #E2482B;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --gx: max(16px, env(safe-area-inset-left, 0px)); --gy: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1320; --card: #161D2D; --ink: #E6EAF3; --muted: #93A0BA; --line: #273047; --band: #2A3349; --band-ink: #E6EAF3;
    --accent: #3E6BF0; --accent-ink: #FFFFFF; --sun: #F5C24B; --sun-ink: #1E1A0E;
    --good: #4CC487; --warn: #E8AA3B; --bad: #F26A73; --scrim: rgba(0, 0, 0, .65);
    --c-vida: #8792AA; --c-familia: #B08AF0; --c-escola: #6AAEF5; --c-amor: #F27BA8; --c-saude: #4CC487;
    --c-dinheiro: #EBC244; --c-trabalho: #8FAACB; --c-fama: #FF9561; --c-crime: #C9CCD3; --c-infancia: #FF7A5C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1320; --card: #161D2D; --ink: #E6EAF3; --muted: #93A0BA; --line: #273047; --band: #2A3349; --band-ink: #E6EAF3;
  --accent: #3E6BF0; --accent-ink: #FFFFFF; --sun: #F5C24B; --sun-ink: #1E1A0E;
  --good: #4CC487; --warn: #E8AA3B; --bad: #F26A73; --scrim: rgba(0, 0, 0, .65);
  --c-vida: #8792AA; --c-familia: #B08AF0; --c-escola: #6AAEF5; --c-amor: #F27BA8; --c-saude: #4CC487;
  --c-dinheiro: #EBC244; --c-trabalho: #8FAACB; --c-fama: #FF9561; --c-crime: #C9CCD3; --c-infancia: #FF7A5C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: var(--gx); padding-right: var(--gy); padding-block: 0 calc(206px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .45; }
[hidden] { display: none !important; }

/* cabeçalho */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--card); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * var(--gx)); margin-right: calc(-1 * var(--gy)); padding: 10px var(--gy) 10px var(--gx); }
.topo-in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.menu { background: none; border: 1px solid var(--line); border-radius: 10px; width: 38px; height: 38px; font-size: 18px; flex-shrink: 0; }
.quem { min-width: 0; flex: 1; }
.nome-linha { display: flex; align-items: center; gap: 6px; min-width: 0; }
.uf { font-size: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 4px; flex-shrink: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.15; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cash { text-align: right; flex-shrink: 0; position: relative; }
.cash strong { display: block; font-size: 18px; color: var(--accent); }
.cash strong.neg { color: var(--bad); }
.cash .lbl { font-size: 11px; color: var(--muted); }

/* avatares */
.av { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--paper); flex-shrink: 0; overflow: hidden; }
.av svg { width: 100%; height: 100%; }
.av.pet { font-size: 24px; }
.av.dead { filter: grayscale(1); opacity: .6; }
.av.grande { width: 64px; height: 64px; }
.av.grande.pet { font-size: 38px; }
.topo .av { width: 44px; height: 44px; }

/* diário */
.log { max-width: 600px; margin: 14px auto 0; display: flex; flex-direction: column; gap: 14px; }
.yr h3 { font-family: var(--display); font-weight: 700; font-size: 16px; margin: 0 0 2px; color: var(--accent); }
.yr h3 .mono { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.yr ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.yr li { position: relative; padding-left: 16px; }
.yr li::before { content: ""; position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--c-vida)); }
.yr li.good { font-weight: 700; }
.yr li.bad { color: var(--bad); }
.yr li.quiet { color: var(--muted); }
.yr:not(.now) { opacity: .82; }
.cat-vida { --dot: var(--c-vida); } .cat-familia { --dot: var(--c-familia); } .cat-escola { --dot: var(--c-escola); }
.cat-amor { --dot: var(--c-amor); } .cat-saude { --dot: var(--c-saude); } .cat-dinheiro { --dot: var(--c-dinheiro); }
.cat-trabalho { --dot: var(--c-trabalho); } .cat-fama { --dot: var(--c-fama); } .cat-crime { --dot: var(--c-crime); } .cat-infancia { --dot: var(--c-infancia); }
.obit { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.obit h2 { font-family: var(--display); font-size: 22px; margin: 0; }
.obit dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.obit dt { color: var(--muted); } .obit dd { margin: 0; }
.fita { justify-self: start; background: var(--sun); color: var(--sun-ink); font-family: var(--display); font-weight: 800; padding: 4px 20px 4px 12px; clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%); }
.legado { display: grid; gap: 8px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-weight: 700; }

/* doca */
.doca { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line);
  padding: 0 var(--gy) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gx); }
.nav { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: end; background: var(--accent); color: var(--accent-ink);
  margin-left: calc(-1 * var(--gx)); margin-right: calc(-1 * var(--gy)); padding: 6px var(--gy) 6px var(--gx); }
@media (min-width: 640px) { .nav { margin-left: auto; margin-right: auto; border-radius: 0 0 14px 14px; } }
.tab { background: none; border: 0; padding: 4px 2px; font-size: 12px; font-weight: 700; display: grid; justify-items: center; gap: 3px; min-width: 0; }
.ico-c { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 18px; }
.age { width: 78px; height: 78px; border-radius: 50%; border: 5px solid var(--card); background: var(--sun); color: var(--sun-ink); margin: -30px 6px -6px;
  font-family: var(--display); font-weight: 800; font-size: 26px; line-height: .9; display: grid; place-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.2); transition: transform .12s ease; }
.age small { font-family: var(--body); font-size: 12px; font-weight: 700; }
.age:active:not(:disabled) { transform: scale(.94); }
.stats { max-width: 600px; margin: 8px auto 0; display: grid; gap: 4px; }
.stat { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; position: relative; }
.stat .lbl { font-weight: 700; font-size: 13px; text-align: right; color: var(--accent); }
.bar { height: 14px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.bar > span, .mini > span { display: block; height: 100%; transition: width .4s ease; }
.stat .v { font-size: 12px; font-weight: 500; }
.delta { position: absolute; right: 48px; top: -6px; font-family: var(--mono); font-size: 12px; padding: 0 5px; border-radius: 6px; background: var(--card); animation: sobe 1.8s ease forwards; pointer-events: none; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.cash .delta { right: 0; top: auto; bottom: -14px; }
@keyframes sobe { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* painéis */
.painel { position: fixed; inset: 0; z-index: 15; background: var(--paper); display: flex; flex-direction: column; }
.painel-topo { background: var(--accent); color: var(--accent-ink); padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gy) 10px var(--gx); display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.painel-topo button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid currentColor; background: none; color: inherit; font-size: 18px; font-weight: 700; line-height: 1; }
.painel-topo h2 { margin: 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; }
.painel-corpo { flex: 1; overflow-y: auto; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.painel-corpo > * { max-width: 600px; margin-left: auto; margin-right: auto; }
.secao { margin: 0 auto; background: var(--band); color: var(--band-ink); text-align: center; font-size: 13px; letter-spacing: .04em; padding: 5px 16px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 0; border-bottom: 1px solid var(--line);
  padding: 12px var(--gy) 12px var(--gx); }
@media (min-width: 640px) { .row { padding-left: 16px; padding-right: 16px; } }
.row:hover:not(:disabled) { background: color-mix(in srgb, var(--card) 92%, var(--accent)); }
.row .ico { width: 40px; height: 40px; display: grid; place-items: center; font-size: 26px; flex-shrink: 0; }
.row .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row b { font-family: var(--display); font-size: 17px; color: var(--accent); }
.row:disabled b { color: var(--muted); }
.row .rot { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 15px; }
.row small { color: var(--muted); font-size: 13px; }
.row .tag { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
.row .seta { font-size: 24px; color: var(--accent); line-height: 1; }
.mini { display: block; width: 100%; max-width: 220px; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.nota { color: var(--muted); margin: 12px auto; padding: 0 16px; font-size: 14px; }
.cartao .nota { padding: 0; margin: 4px 0 0; }
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; margin: 12px auto !important; width: calc(100% - 32px); }
.cartao > b { font-family: var(--display); font-size: 17px; }
.kv, .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.kv span { color: var(--muted); } .kv b { text-align: right; }
.kv2 span { color: var(--muted); font-size: 13px; } .kv2 .mini { margin: 0; }
.neg { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.perfil { display: flex; gap: 14px; align-items: center; padding: 16px var(--gy) 16px var(--gx); background: var(--card); border-bottom: 1px solid var(--line); }
.perfil > div { display: grid; gap: 2px; min-width: 0; flex: 1; }
.perfil b { font-family: var(--display); font-size: 20px; color: var(--accent); }
.perfil span { color: var(--muted); }
.campo { display: grid; gap: 4px; padding: 8px 16px; }
.campo label { font-weight: 700; font-size: 14px; }
.campo input, .campo select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.largo { display: block; width: calc(100% - 32px); margin: 8px auto 16px !important; }
.conq { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 12px 16px; }
.conq div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.conq div.off { opacity: .45; }
.conq b { display: block; font-size: 14px; } .conq small { color: var(--muted); font-size: 12px; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 16px; list-style: none; }
.legenda li { position: relative; padding-left: 14px; font-size: 13px; }
.legenda li::before { content: ""; position: absolute; left: 0; top: .45em; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }

/* cartões de evento */
.modal { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 16px var(--gy) 16px var(--gx); --cor: var(--accent); }
.cartao-ev { position: relative; background: var(--card); border: 4px solid var(--cor); border-radius: 22px; padding: 18px 0 20px; width: min(440px, 100%); max-height: 92%; overflow-y: auto; display: grid; gap: 14px; }
.fechar-x { position: absolute; top: 8px; left: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--paper); color: var(--bad); font-size: 18px; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.15); z-index: 1; }
.fita-ev { display: flex; align-items: center; gap: 10px; margin-left: 40px; padding: 6px 18px 6px 0; min-height: 44px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--cor) 35%, transparent) 45%, var(--cor)); }
.fita-ev .av { width: 52px; height: 52px; margin-left: -24px; }
.fita-ev #evNome { flex: 1; min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fita-ev em { margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.ev-cab { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 20px; }
.ev-cab span { font-size: 30px; }
.ev-cab h2 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
#evTexto { margin: 0; padding: 0 24px; font-size: 17px; text-align: center; }
#evInfo { margin: 0 20px; display: grid; }
#evInfo div { display: flex; justify-content: center; gap: 6px; padding: 6px 10px; }
#evInfo div:nth-child(odd) { background: var(--paper); }
#evInfo dt { font-weight: 700; } #evInfo dd { margin: 0; }
#evBarras { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 10px; align-items: center; padding: 0 20px; }
#evBarras .lbl { font-weight: 700; text-align: right; }
#evBarras .v { font-size: 12px; min-width: 26px; }
#evForm { display: grid; gap: 12px; padding: 0 20px; }
.campo-ev { display: grid; gap: 4px; font-weight: 700; color: var(--accent); }
.campo-ev select { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--accent); border-radius: 6px; padding: 8px 10px; }
.choices { display: grid; gap: 10px; padding: 0 20px; }
.choices button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 13px 14px; font-weight: 700; font-size: 16px; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.choices button.ok { background: var(--good); box-shadow: 0 3px 0 color-mix(in srgb, var(--good) 60%, #000); }
.modal.marco .choices button.ok { background: var(--sun); color: var(--sun-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--sun) 60%, #000); }
.surpresa { justify-self: center; background: none; border: 0; color: var(--accent); text-decoration: underline; font-weight: 700; font-size: 16px; }
.av-btn { border: 0; padding: 0; background: none; border-radius: 50%; }

/* minijogos */
.jogo-card { background: var(--card); border: 4px solid var(--c-crime); border-radius: 22px; padding: 16px; width: min(400px, 100%); max-height: 96%; overflow-y: auto; display: grid; gap: 10px; justify-items: center; }
.jogo-card h2 { font-family: var(--display); margin: 0; text-align: center; }
#jogoTexto { margin: 0; text-align: center; font-size: 14px; }
.grade { display: grid; width: 100%; max-width: 340px; aspect-ratio: 1; border-radius: 8px; overflow: hidden; touch-action: none; user-select: none; }
.grade .c { display: grid; place-items: center; font-size: clamp(12px, 4.5vw, 20px); line-height: 1; overflow: hidden; }
.grade .c .av { width: 100%; height: 100%; background: none; }
.grade .c.parede { background: var(--accent); } .grade .c.chao { background: #FBF3D9; } .grade .c.saida { background: var(--good); } .grade .c.cao { background: #F2B8B5; }
.grade.hack { background: #12151C; gap: 3px; padding: 3px; }
.grade .c.hk { background: #1E2430; border-radius: 6px; }
.grade .c.hk i { width: 70%; height: 70%; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 800; font-size: 20px; }
.ctrl { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 46px); gap: 6px; }
.ctrl button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; font-size: 20px; }
.ctrl .cima { grid-column: 2; }
#jogoMsg { color: var(--muted); text-align: center; margin: 0; font-size: 14px; font-weight: 700; }
#evExtra { display: grid; place-items: center; }
.placa { width: 140px; height: 140px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(220px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 16px; max-width: calc(100% - 32px); font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
#confete { position: fixed; inset: 0; z-index: 25; pointer-events: none; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <button class="menu" data-go="menu" aria-label="Menu">☰</button>
    <button id="avatar" class="av-btn" aria-label="Ver seu perfil"></button>
    <div class="quem">
      <div class="nome-linha"><span id="uf" class="uf mono"></span><h1 id="nome"></h1></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="cash"><strong id="money" class="mono"></strong><span class="lbl">Saldo bancário</span><span id="moneyDelta"></span></div>
  </div>
</header>
<main class="log" id="log" aria-live="polite"></main>

<footer class="doca">
  <nav class="nav" aria-label="Ações">
    <button class="tab" data-go="ocupacao" id="tabOcupacao"></button>
    <button class="tab" data-go="bens"><span class="ico-c">💰</span>Bens</button>
    <button class="age" id="age" aria-label="Avançar um ano">+<small>Idade</small></button>
    <button class="tab" data-go="relacoes"><span class="ico-c">❤️</span>Relações</button>
    <button class="tab" data-go="atividades"><span class="ico-c">⋯</span>Atividades</button>
  </nav>
  <section class="stats" id="stats" aria-label="Atributos"></section>
</footer>

<section class="painel" id="painel" hidden role="dialog" aria-modal="true" aria-labelledby="painelTitulo">
