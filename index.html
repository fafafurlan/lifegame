<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna estreita como uma certidão de vida; diário de anos, barra fixa com o botão "+1 ano" como único ponto de cor forte */
:root {
  --paper: #EDF0F5;
  --card: #FFFFFF;
  --ink: #17223A;
  --muted: #5A6681;
  --line: #D3D9E5;
  --accent: #2B55E0;
  --sun: #F4B62C;
  --sun-ink: #1E1A0E;
  --good: #23885A;
  --warn: #C27D0E;
  --bad: #C6303B;
  --scrim: rgba(12, 18, 32, .45);
  --c-vida: #8A94A8; --c-familia: #8452C9; --c-escola: #2B7FD9; --c-amor: #D3457B; --c-saude: #23885A;
  --c-dinheiro: #C2920E; --c-trabalho: #4F6F8F; --c-fama: #E0662B; --c-crime: #33363D;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1320; --card: #161D2D; --ink: #E6EAF3; --muted: #93A0BA; --line: #2A3349;
    --accent: #7E9CFF; --sun: #F5C24B; --sun-ink: #1E1A0E; --good: #4CC487; --warn: #E8AA3B; --bad: #F26A73;
    --scrim: rgba(0, 0, 0, .6);
    --c-vida: #8792AA; --c-familia: #B08AF0; --c-escola: #6AAEF5; --c-amor: #F27BA8; --c-saude: #4CC487;
    --c-dinheiro: #EBC244; --c-trabalho: #8FAACB; --c-fama: #FF9561; --c-crime: #C9CCD3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1320; --card: #161D2D; --ink: #E6EAF3; --muted: #93A0BA; --line: #2A3349;
  --accent: #7E9CFF; --sun: #F5C24B; --sun-ink: #1E1A0E; --good: #4CC487; --warn: #E8AA3B; --bad: #F26A73;
  --scrim: rgba(0, 0, 0, .6);
  --c-vida: #8792AA; --c-familia: #B08AF0; --c-escola: #6AAEF5; --c-amor: #F27BA8; --c-saude: #4CC487;
  --c-dinheiro: #EBC244; --c-trabalho: #8FAACB; --c-fama: #FF9561; --c-crime: #C9CCD3;
  color-scheme: dark;
}
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px));
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .45; }

.top { display: grid; gap: 4px; padding-top: 18px; }
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.who { min-width: 0; }
.reg { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-btn { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 6vw, 32px); line-height: 1.1; margin: 4px 0 2px; text-wrap: balance; }
.sub { color: var(--muted); }
.cash { text-align: right; flex-shrink: 0; position: relative; }
.cash .lbl { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cash strong { font-size: 19px; }
.neg { color: var(--bad); }

.stats { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.stat { display: grid; grid-template-columns: 104px 1fr 34px; align-items: center; gap: 10px; position: relative; }
.stat span:first-child { font-weight: 700; font-size: 14px; }
.track { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
.stat .v { text-align: right; font-size: 13px; color: var(--muted); }
.delta { position: absolute; right: -6px; top: -14px; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 0 5px; border-radius: 6px;
  background: var(--card); animation: sobe 1.8s ease forwards; pointer-events: none; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.cash .delta { right: 0; top: -16px; }
@keyframes sobe { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

.log { display: flex; flex-direction: column; gap: 14px; }
.yr { border-left: 2px solid var(--line); padding-left: 14px; }
.yr.now { border-left-color: var(--accent); }
.yr header { display: flex; align-items: baseline; gap: 10px; }
.yr h3 { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 0; }
.yr .ano { font-size: 12px; color: var(--muted); }
.yr ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; }
.yr li { position: relative; padding-left: 16px; }
.yr li::before { content: ""; position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--c-vida)); }
.yr li.good { font-weight: 700; }
.yr li.bad { color: var(--bad); }
.yr li.quiet { color: var(--muted); }
.cat-vida { --dot: var(--c-vida); } .cat-familia { --dot: var(--c-familia); } .cat-escola { --dot: var(--c-escola); }
.cat-amor { --dot: var(--c-amor); } .cat-saude { --dot: var(--c-saude); } .cat-dinheiro { --dot: var(--c-dinheiro); }
.cat-trabalho { --dot: var(--c-trabalho); } .cat-fama { --dot: var(--c-fama); } .cat-crime { --dot: var(--c-crime); }

.obit { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.obit h2 { font-family: var(--display); font-size: 22px; margin: 0; }
.fita { display: inline-flex; align-items: center; gap: 8px; align-self: start; justify-self: start; background: var(--sun); color: var(--sun-ink);
  font-family: var(--display); font-weight: 800; padding: 4px 18px 4px 12px; clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%); }
.obit dl, .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.obit dt, .kv span { color: var(--muted); }
.obit dd { margin: 0; }
.kv b { text-align: right; }
.legado { display: grid; gap: 8px; }

.primary { background: var(--accent); color: var(--card); border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: end; gap: 4px; }
.tab { background: none; border: 0; padding: 12px 2px 6px; font-size: 13px; font-weight: 700; color: var(--muted); border-radius: 10px; }
.tab:hover { color: var(--ink); }
.age { width: 70px; height: 70px; border-radius: 50%; border: 4px solid var(--card); background: var(--sun); color: var(--sun-ink);
  font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; margin: -26px 6px 0; display: grid; place-content: center;
  box-shadow: 0 6px 18px rgba(0,0,0,.18); transition: transform .12s ease; }
.age small { font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.age:active:not(:disabled) { transform: scale(.94); }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 11; width: min(560px, 100%); max-height: 84%; overflow-y: auto;
  background: var(--card); border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; position: sticky; top: -16px; background: var(--card); padding-block: 6px; z-index: 1; }
.sheet-head h2 { font-family: var(--display); font-size: 21px; margin: 0; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.legado .ghost { padding: 12px 16px; font-weight: 700; }
.group { display: grid; gap: 8px; margin-bottom: 18px; }
.group h4 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--paper);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
.row > span:first-child { min-width: 0; }
.row:hover:not(:disabled) { border-color: var(--accent); }
.row b { display: block; }
.row small { color: var(--muted); }
.row .tag { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
.note { color: var(--muted); margin: 0; }
.intro { margin-bottom: 14px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; display: grid; gap: 8px; }
.card.dead { opacity: .55; }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.card-top > span { min-width: 0; }
.card-top small { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: 13px; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: 14px; }
.field input, .field select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.conq { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.conq div { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.conq div.off { opacity: .45; }
.conq b { display: block; font-size: 14px; }
.conq small { color: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; }
.legend li { position: relative; padding-left: 14px; font-size: 13px; }
.legend li::before { content: ""; position: absolute; left: 0; top: .45em; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }

.modal { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { background: var(--card); border-radius: 18px; padding: 20px; width: min(440px, 100%); max-height: 90%; overflow-y: auto; display: grid; gap: 12px; border: 1px solid var(--line); }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.modal-card h2 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 0; text-wrap: balance; }
.modal-card p { margin: 0; font-size: 17px; }
.modal.marco .modal-card { border: 3px solid var(--sun); }
.choices { display: grid; gap: 8px; }
.choices button { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-weight: 700; }
.choices button:hover { border-color: var(--accent); }
.modal.marco .choices button { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); text-align: center; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 16px; max-width: calc(100% - 32px); font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
#confete { position: fixed; inset: 0; z-index: 25; pointer-events: none; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="reg mono" id="reg"></div>
      <button class="menu-btn" data-open="menu">Menu</button>
    </div>
    <div class="top-main">
      <div class="who">
        <h1 id="nome"></h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="cash"><span class="lbl">Saldo</span><strong id="money" class="mono"></strong><span id="moneyDelta"></span></div>
    </div>
  </header>
  <section class="stats" id="stats" aria-label="Atributos"></section>
  <main class="log" id="log" aria-live="polite"></main>
</div>

<nav class="bar" aria-label="Ações">
  <div class="bar-in">
    <button class="tab" data-open="atividades">Atividades</button>
    <button class="tab" data-open="carreira" id="tabCarreira">Escola</button>
    <button class="age" id="age" aria-label="Avançar um ano">+1<small>ano</small></button>
    <button class="tab" data-open="pessoas">Pessoas</button>
    <button class="tab" data-open="bens">Bens</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="ghost" id="sheetClose">Fechar</button></div>
  <div id="sheetBody"></div>
</section>
<section class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalText">
  <div class="modal-card">
    <div class="eyebrow mono" id="modalTag"></div>
    <h2 id="modalTitle" hidden></h2>
    <p id="modalText"></p>
    <div class="choices" id="modalChoices"></div>
  </div>
</section>
<div class="toast" id="toast" hidden role="status"></div>
<canvas id="confete" hidden></canvas>

function ocupacao() {
  if (!S.vivo) return G('Falecido', 'Falecida');
  if (S.preso) return `${G('Preso', 'Presa')} · falta${S.preso > 1 ? 'm' : ''} ${S.preso} ${S.preso === 1 ? 'ano' : 'anos'}`;
  if (S.emprego) return S.emprego.titulo;
  if (S.faculdade) return `${G('Universitário', 'Universitária')} · ${S.faculdade.curso}`;
  if (S.escola) return S.escola === 'fundamental' ? 'Ensino fundamental' : 'Ensino médio';
  if (S.aposentado) return G('Aposentado', 'Aposentada');
  if (S.idade < 2) return 'Bebê';
  if (S.idade < 6) return 'Criança';
  return G('Desempregado', 'Desempregada');
}
const cor = v => (v < 25 ? 'var(--bad)' : v < 50 ? 'var(--warn)' : 'var(--good)');
const badge = d => (d ? `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</span>` : '');
const barra = (rot, v, d) => `<div class="stat"><span>${rot}</span><div class="track"><div class="fill" style="width:${v}%;background:${cor(v)}"></div></div><span class="v mono">${v}</span>${badge(d)}</div>`;

function render() {
  const partes = [`Registro nº ${S.reg}`, S.cidade];
  if (S.pais !== 'Brasil') partes.push(S.pais);
  if (S.geracao > 1) partes.push(`${S.geracao}ª geração`);
  $('reg').textContent = partes.join(' · ');
  $('nome').textContent = S.nome;
  $('sub').textContent = `${S.idade} ${S.idade === 1 ? 'ano' : 'anos'} · ${ocupacao()}${S.seguidores >= 1000 ? ` · ${num(S.seguidores)} seguidores` : ''}`;
  $('money').textContent = fmt(S.dinheiro);
  $('money').classList.toggle('neg', S.dinheiro < 0);
  const dm = deltas.dinheiro || 0;
  $('moneyDelta').innerHTML = dm ? `<span class="delta ${dm > 0 ? 'up' : 'down'}">${dm > 0 ? '+' : '−'}${fmt(Math.abs(dm))}</span>` : '';
  $('stats').innerHTML = STATS.map(([k, n]) => barra(n, S.st[k], deltas[k])).join('');
  deltas = {};

  let html = '';
  if (!S.vivo) {
    const f = S.fita || fita();
    const herdeiros = filhosVivos();
    html += `<section class="obit">
      <span class="fita">${esc(f[0])}</span>
      <h2>${esc(S.nome)}</h2>
      <p class="note">${esc(f[1])}</p>
      <dl><dt>Viveu</dt><dd class="mono">${S.nasc} – ${S.ano} · ${S.idade} anos</dd>
      <dt>Profissão</dt><dd>${esc(S.ultimoTrabalho || 'Nenhuma')}</dd>
      <dt>Formação</dt><dd>${S.cursos.length ? S.cursos.join(', ') : FORM_NOME[S.formacao]}</dd>
      <dt>Filhos</dt><dd class="mono">${S.rel.filter(r => r.tipo === 'filho').length}</dd>
      <dt>Patrimônio</dt><dd class="mono">${fmt(patrimonio())}</dd></dl>
      <div class="legado">
        ${herdeiros.map(h => `<button class="primary" data-act="legado" data-id="${h.id}">Continuar como ${esc(h.nome.split(' ')[0])} (${h.idade} anos)</button>`).join('')}
        <button class="${herdeiros.length ? 'ghost' : 'primary'}" data-act="novaVidaRapida">Viver uma vida nova</button>
      </div></section>`;
  }
  html += S.log.slice().reverse().map((y, idx) => `<article class="yr${idx === 0 ? ' now' : ''}"><header><h3>${y.i === 0 ? 'Nascimento' : y.i + (y.i === 1 ? ' ano' : ' anos')}</h3><span class="ano mono">${y.a}</span></header>
    <ul>${y.l.map(x => `<li class="cat-${x.c || 'vida'} ${x.tone}">${esc(x.t)}</li>`).join('')}</ul></article>`).join('');
  $('log').innerHTML = html;

  $('tabCarreira').textContent = S.idade < 18 ? 'Escola' : 'Carreira';
  $('age').disabled = !S.vivo || S.fila.length > 0;
  checarConquistas();
  renderModal();
  if (!$('sheet').hidden) abrir(sheetAtual);
}

function renderModal() {
  const item = S.fila[0];
  const m = $('modal');
  if (!item || !S.vivo) { m.hidden = true; return; }
  fecharSheet();
  if (item.id === '__marco') {
    const novo = m.hidden || !m.classList.contains('marco');
    m.classList.add('marco');
    $('modalTag').textContent = `Marco da vida · ${S.idade} ${S.idade === 1 ? 'ano' : 'anos'}`;
    $('modalTitle').hidden = false; $('modalTitle').textContent = item.d.titulo;
    $('modalText').textContent = item.d.texto;
    $('modalChoices').innerHTML = '<button data-escolha="0">Seguir em frente</button>';
    if (novo) { som('marco'); confete(); }
  } else {
    m.classList.remove('marco');
    const e = EV[item.id];
    // descarta perguntas que deixaram de fazer sentido (ex.: perdeu o emprego no mesmo ano)
    let valido = !!e;
    if (e && e.cond) { try { valido = !!e.cond(S); } catch (err) { valido = false; } }
    if (!valido) { S.fila.shift(); renderModal(); return; }
    const lista = typeof e.escolhas === 'function' ? e.escolhas(S, item.d) : e.escolhas;
    $('modalTag').textContent = `${S.idade} ${S.idade === 1 ? 'ano' : 'anos'} · ${CATS[e.cat] || 'Vida'}`;
    $('modalTitle').hidden = true;
    $('modalText').textContent = e.texto(S, item.d);
    $('modalChoices').innerHTML = lista.map((c, i) => `<button data-escolha="${i}">${esc(rotuloTexto(c.t))}</button>`).join('');
  }
  m.hidden = false;
  const b = $('modalChoices').querySelector('button');
  if (b) b.focus();
}
function escolher(i) {
  deltas = {};
  const item = S.fila.shift();
  if (item.id !== '__marco') {
    const e = EV[item.id];
    const lista = typeof e.escolhas === 'function' ? e.escolhas(S, item.d) : e.escolhas;
    CUR_CAT = e.cat || 'vida';
    try { lista[i].fx(S, item.d); } catch (err) { console.warn('Escolha com erro:', item.id, err); }
    CUR_CAT = null;
  }
  morteImediata();
  salvar(); render();
  if (!S.fila.length) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function morteImediata() { if (S.vivo && S.st.saude <= 0) morte(); }

let sheetAtual = null;
const TITULOS = { atividades: 'Atividades', pessoas: 'Pessoas', bens: 'Bens', menu: 'Menu' };
function abrir(nome) {
  sheetAtual = nome;
  $('sheetTitle').textContent = nome === 'carreira' ? (S.idade < 18 ? 'Escola' : 'Carreira') : TITULOS[nome];
  const y = $('sheet').scrollTop;
  $('sheetBody').innerHTML = ({ atividades: htmlAtividades, carreira: htmlCarreira, pessoas: htmlPessoas, bens: htmlBens, menu: htmlMenu })[nome]();
  $('sheet').hidden = false; $('scrim').hidden = false;
  $('sheet').scrollTop = y;
}
function fecharSheet() { $('sheet').hidden = true; $('scrim').hidden = true; }
const morto = () => (S.vivo ? '' : '<p class="note">Esta vida acabou. Continue com um herdeiro ou comece uma nova.</p>');
const linha = (attrs, titulo, sub, tag, off) => `<button class="row" ${attrs} ${off ? 'disabled' : ''}><span><b>${titulo}</b>${sub ? `<small>${sub}</small>` : ''}</span><span class="tag mono">${tag}</span></button>`;

function htmlAtividades() {
  if (!S.vivo) return morto();
  let h = S.preso ? '<p class="note intro">Na prisão, só dá para estudar, ler, meditar e malhar.</p>' : '<p class="note intro">Cada atividade pode ser feita uma vez por ano. Antes dos 18, seus pais pagam.</p>';
  const grupos = {};
  ATIVIDADES.forEach(a => {
    if (S.preso && !a.prisao) return;
    if (a.mostra && !a.mostra()) return;
    (grupos[a.g] = grupos[a.g] || []).push(a);
  });
  Object.entries(grupos).forEach(([g, lista]) => {
    h += `<div class="group"><h4>${g}</h4>`;
    if (g === 'Saúde' && S.idade >= 18 && !S.preso)
      h += linha('data-act="plano"', S.plano ? 'Cancelar plano de saúde' : 'Contratar plano de saúde', S.plano ? 'Médico grátis e tratamentos mais baratos' : 'Médico grátis, tratamentos 80% mais baratos', `${fmt(preco(6000))}/ano`);
    if (g === 'Saúde') S.doencas.forEach(n => {
      const c = S.idade < 18 ? 0 : Math.round(preco(DOENCAS[n].custo) * (S.plano ? .2 : 1));
      const feito = S.feitosAno['trat:' + n];
      h += linha(`data-act="tratar" data-id="${esc(n)}"`, `Tratar ${n.toLowerCase()}`, `Chance de cura: ${Math.round((DOENCAS[n].cura + (S.plano ? .15 : 0)) * 100)}%`, feito ? 'Feito este ano' : (c ? fmt(c) : 'Grátis'), feito || c > S.dinheiro);
    });
    lista.forEach(a => {
      const c = custoAtividade(a);
      let motivo = '';
      if (S.idade < a.min) motivo = `A partir de ${a.min} anos`;
      else if (S.feitosAno['at:' + a.id]) motivo = 'Feito este ano';
      else if (c && S.dinheiro < c) motivo = 'Sem saldo';
      h += linha(`data-act="atividade" data-id="${a.id}"`, a.nome, a.desc, motivo || (c ? fmt(c) : 'Grátis'), !!motivo);
    });
    h += '</div>';
  });
  return h;
}

function htmlCarreira() {
  if (!S.vivo) return morto();
  if (S.preso) return `<p class="note">Você está na prisão. Falta${S.preso > 1 ? 'm' : ''} ${S.preso} ${S.preso === 1 ? 'ano' : 'anos'} de pena. Estudar e ler continuam liberados em Atividades.</p>`;
  let h = '<div class="group"><h4>Formação</h4>';
  if (S.idade < 6) h += `<p class="note">Você ainda é ${G('pequeno', 'pequena')} demais para a escola. As aulas começam aos 6 anos.</p>`;
  else {
    const partes = [];
    if (S.escola) partes.push(`Cursando o ${S.escola === 'fundamental' ? 'ensino fundamental' : 'ensino médio'}.`);
    else partes.push(`${FORM_NOME[S.formacao]}${S.cursos.length ? ' em ' + S.cursos.join(' e ') : ''}.`);
    if (S.faculdade) partes.push(`Faculdade de ${S.faculdade.curso} (${S.faculdade.tipo === 'bolsa' ? 'bolsa ProUni' : S.faculdade.fies ? 'Fies' : S.faculdade.tipo}), ano ${S.faculdade.ano + 1} de ${CURSOS[S.faculdade.curso].anos}.`);
    if (S.fies > 0) partes.push(`Dívida do Fies: ${fmt(S.fies)}.`);
    h += `<p class="note">${partes.join(' ')}</p>`;
    if (S.idade >= 18 && !S.escola && !S.faculdade && FORM[S.formacao] >= FORM.medio && !S.aposentado)
      h += linha('data-act="faculdade"', 'Entrar na faculdade', 'Federal, ProUni, Fies ou particular', '›');
    if (S.faculdade) h += linha('data-act="trancar"', 'Largar a faculdade', 'Você perde o progresso do curso', '›');
  }
  h += '</div>';
  if (S.emprego) {
    const e = S.emprego;
    h += `<div class="group"><h4>Emprego</h4>
      <div class="card"><div class="card-top"><b>${esc(e.titulo)}</b><small class="mono">${fmt(e.sal)}/ano</small></div>
      ${barra('Desempenho', e.desemp)}
      <small class="note">${e.anos} ${e.anos === 1 ? 'ano' : 'anos'} no cargo</small>
      <div class="chips">
        <button class="chip" data-act="trab" data-id="esforco" ${S.feitosAno['trab:esforco'] ? 'disabled' : ''}>Trabalhar mais</button>
        <button class="chip" data-act="trab" data-id="aumento" ${S.feitosAno['trab:aumento'] ? 'disabled' : ''}>Pedir aumento</button>
        <button class="chip" data-act="trab" data-id="demissao">Pedir demissão</button>
        ${S.idade >= 60 ? '<button class="chip" data-act="trab" data-id="aposentar">Aposentar</button>' : ''}
      </div></div></div>`;
  } else if (S.aposentado) {
    h += `<div class="group"><h4>Aposentadoria</h4><p class="note">${G('Aposentado', 'Aposentada')}, com pensão de ${fmt(S.pensao)} por ano.</p></div>`;
  }
  if (S.seguidores > 0) h += `<div class="group"><h4>Redes sociais</h4><p class="note">${num(S.seguidores)} seguidores.${S.seguidores >= 10000 ? ` Rendem cerca de ${fmt(S.seguidores * .6)} por ano em publicidade.` : ' A partir de 10 mil, começam a render dinheiro.'}</p></div>`;
  if (!S.emprego && !S.aposentado && S.idade >= 16) {
    h += '<div class="group"><h4>Vagas</h4>' + CARREIRAS.map(c => {
      const motivo = podeCandidatar(c) || (S.feitosAno['vaga:' + c.id] ? 'Tente no ano que vem' : '');
      const sal = c.id === 'fut' ? 'variável' : `${fmt(c.sal * PAISES[S.pais].sal)}/ano`;
      return linha(`data-act="vaga" data-id="${c.id}"`, tituloCarreira(c), motivo || (c.concurso ? 'Prestar concurso' : 'Candidatar-se'), sal, !!motivo);
    }).join('') + '</div>';
  } else if (!S.emprego && !S.aposentado && S.idade >= 6) {
    h += '<div class="group"><h4>Vagas</h4><p class="note">Dá para trabalhar a partir dos 16 anos.</p></div>';
  }
  return h;
}

function htmlPessoas() {
  const vivos = S.rel.filter(r => r.vivo), mortos = S.rel.filter(r => !r.vivo);
  const card = r => {
    const acoes = S.vivo && r.vivo ? ACOES_REL.filter(a => a.so(r) && (!S.preso || a.id === 'conversar')).map(a =>
      `<button class="chip" data-act="rel" data-id="${r.id}" data-acao="${a.id}" ${S.feitosAno[r.id + ':' + a.id] ? 'disabled' : ''}>${a.id === 'terminar' && r.casado ? 'Pedir divórcio' : a.nome}</button>`).join('') : '';
    return `<div class="card${r.vivo ? '' : ' dead'}">
      <div class="card-top"><span><b>${esc(r.nome)}</b> <small>${rotulo(r)}</small></span><small class="mono">${r.vivo ? r.idade + ' anos' : (r.sumiu ? 'sumiu' : 'faleceu')}</small></div>
      ${r.vivo ? barra('Relação', r.rel) : ''}
      ${acoes ? `<div class="chips">${acoes}</div>` : ''}</div>`;
  };
  let h = `<div class="group">${vivos.length ? vivos.map(card).join('') : '<p class="note">Ninguém por perto agora.</p>'}</div>`;
  if (S.vivo && !S.preso && !achar('parceiro') && S.idade >= 14)
    h += `<div class="group">${linha('data-act="procurar"', 'Procurar alguém', 'A chance depende da sua aparência', S.feitosAno.procurar ? 'Feito este ano' : '›', S.feitosAno.procurar)}</div>`;
  if (mortos.length) h += '<div class="group"><h4>Em memória</h4>' + mortos.map(card).join('') + '</div>';
  return h;
}

function htmlBens() {
  if (!S.vivo) return morto();
  let h = `<div class="group"><h4>Resumo</h4><div class="kv">
    <span>Saldo</span><b class="mono${S.dinheiro < 0 ? ' neg' : ''}">${fmt(S.dinheiro)}</b>
    <span>Investido</span><b class="mono">${fmt(totalInv())}</b>
    <span>Bens</span><b class="mono">${fmt(valorBens())}</b>
    ${dividaBens() ? `<span>Financiamentos</span><b class="mono neg">${fmt(-dividaBens())}</b>` : ''}
    ${S.fies ? `<span>Fies</span><b class="mono neg">${fmt(-S.fies)}</b>` : ''}
    <span>Patrimônio</span><b class="mono">${fmt(patrimonio())}</b>
    ${S.idade >= 18 && !S.preso ? `<span>Gastos fixos</span><b class="mono">${fmt(custoAnual())}/ano</b>` : ''}</div></div>`;
  if (S.idade < 18) return h + '<p class="note">Comprar, investir e alugar liberam aos 18 anos.</p>';
  if (S.preso) return h + '<p class="note">Na prisão não dá para mexer no patrimônio.</p>';
  const MOR = { pais: 'Na casa dos pais', aluguel: 'Apartamento alugado', propria: 'Imóvel próprio' };
  h += `<div class="group"><h4>Onde você mora</h4><p class="note">${MOR[S.moradia]} · ${fmt(custoMoradia())} por ano</p>`;
  if (S.moradia !== 'aluguel') h += linha('data-act="mudar" data-id="aluguel"', 'Alugar um apartamento', 'Mais liberdade e felicidade', `${fmt(preco(18000))}/ano`);
  if (S.moradia !== 'pais' && paisVivos().length) h += linha('data-act="mudar" data-id="pais"', 'Voltar para a casa dos pais', 'Economia, mas pesa depois dos 25', `${fmt(preco(3000))}/ano`);
  if (S.moradia !== 'propria' && S.bens.some(b => b.tipo === 'imovel')) h += linha('data-act="mudar" data-id="propria"', 'Morar no seu imóvel', 'Só condomínio e IPTU', `${fmt(preco(6000))}/ano`);
  h += '</div>';
  if (S.bens.length) {
    h += '<div class="group"><h4>Seus bens</h4>' + S.bens.map(b => `<div class="card"><div class="card-top"><b>${esc(b.nome)}</b><small class="mono">${fmt(b.valor)}</small></div>
      ${b.anos ? `<small class="note">Parcela de ${fmt(b.parcela)} por ano · faltam ${b.anos} ${b.anos === 1 ? 'ano' : 'anos'}</small>` : '<small class="note">Quitado</small>'}
      <div class="chips"><button class="chip" data-act="vender" data-id="${b.id}">Vender por ${fmt(b.valor - b.parcela * b.anos)}</button></div></div>`).join('') + '</div>';
  }
  const INV = [['poupanca', 'Poupança', 'Rende 6% ao ano, sem risco'], ['acoes', 'Ações', 'Entre −25% e +35% ao ano'], ['cripto', 'Criptomoedas', 'Entre −75% e +100% ao ano']];
  h += '<div class="group"><h4>Investimentos</h4>' + INV.map(([k, n, d]) => `<div class="card"><div class="card-top"><span><b>${n}</b> <small>${d}</small></span><small class="mono">${fmt(S.inv[k])}</small></div>
    <div class="chips">
      <button class="chip" data-act="investir" data-id="${k}" data-v="1000" ${S.dinheiro < 1000 ? 'disabled' : ''}>+ ${fmt(1000)}</button>
      <button class="chip" data-act="investir" data-id="${k}" data-v="10000" ${S.dinheiro < 10000 ? 'disabled' : ''}>+ ${fmt(10000)}</button>
      <button class="chip" data-act="investir" data-id="${k}" data-v="tudo" ${S.dinheiro < 1 ? 'disabled' : ''}>Aplicar todo o saldo</button>
      <button class="chip" data-act="resgatar" data-id="${k}" ${S.inv[k] < 1 ? 'disabled' : ''}>Resgatar</button>
    </div></div>`).join('') + '</div>';
  const loja = (lista, tipo, titulo, anos) => `<div class="group"><h4>${titulo}</h4>` + lista.map(i => {
    const v = preco(i.valor), entrada = Math.round(v * .2);
    return `<div class="card"><div class="card-top"><b>${i.nome}</b><small class="mono">${fmt(v)}</small></div>
      <div class="chips">
        <button class="chip" data-act="comprar" data-tipo="${tipo}" data-id="${i.id}" data-modo="vista" ${S.dinheiro < v ? 'disabled' : ''}>Comprar à vista</button>
        <button class="chip" data-act="comprar" data-tipo="${tipo}" data-id="${i.id}" data-modo="fin" ${S.dinheiro < entrada || !S.emprego ? 'disabled' : ''}>Financiar em ${anos} anos (entrada ${fmt(entrada)})</button>
      </div></div>`;
  }).join('') + (S.emprego ? '' : '<p class="note">Financiar exige emprego.</p>') + '</div>';
  h += loja(IMOVEIS, 'imovel', 'Imóveis à venda', 30) + loja(CARROS, 'carro', 'Carros à venda', 5);
  return h;
}

function htmlMenu() {
  const vidas = lerLS(VIDAS_KEY, []);
  return `<div class="group"><h4>Conquistas · ${CONQ.length} de ${CONQUISTAS.length}</h4><div class="conq">
    ${CONQUISTAS.map(c => `<div class="${CONQ.includes(c.id) ? '' : 'off'}"><b>${c.nome}</b><small>${c.desc}</small></div>`).join('')}</div></div>
    ${vidas.length ? `<div class="group"><h4>Vidas anteriores</h4>${vidas.slice(0, 8).map(v => `<div class="card"><div class="card-top"><span><b>${esc(v.nome)}</b> <small>${esc(v.fita)}</small></span><small class="mono">${v.idade} anos</small></div></div>`).join('')}</div>` : ''}
    <div class="group"><h4>Nova vida</h4>
    <div class="field"><label for="nvNome">Primeiro nome</label><input id="nvNome" maxlength="24" placeholder="Deixe vazio para sortear"></div>
    <div class="field"><label for="nvSexo">Sexo</label><select id="nvSexo"><option value="">Sortear</option><option value="F">Feminino</option><option value="M">Masculino</option></select></div>
    <div class="field"><label for="nvInt">Interesse amoroso</label><select id="nvInt"><option value="A">Homens e mulheres</option><option value="M">Homens</option><option value="F">Mulheres</option></select></div>
    <button class="primary" data-act="novaVida">${S.vivo ? 'Começar do zero (apaga a vida atual)' : 'Nascer de novo'}</button></div>
    <div class="group"><h4>Ajustes</h4>
    ${linha('data-act="som"', 'Sons', 'Efeitos curtos ao passar o ano e nos marcos', somLigado ? 'Ligado' : 'Desligado')}</div>
    <div class="group"><h4>Como jogar</h4>
    <p class="note">Toque em +1 ano para envelhecer. Algumas situações pedem uma escolha, e as escolhas destravam outras situações no futuro. Cuide dos atributos em Atividades, estude e trabalhe em Carreira, cuide da família em Pessoas e do dinheiro em Bens. Quando a vida acabar, dá para continuar como um dos filhos. O progresso fica salvo neste navegador.</p>
    <ul class="legend">${Object.entries(CATS).map(([k, n]) => `<li class="cat-${k}">${n}</li>`).join('')}</ul></div>`;
}

// ================= cliques =================
document.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.open) { abrir(b.dataset.open); return; }
  if (b.dataset.escolha !== undefined) { escolher(+b.dataset.escolha); return; }
  const act = b.dataset.act, id = b.dataset.id;
  if (!act || !S) return;
  if ((act === 'trab' && !S.emprego) || (act === 'trancar' && !S.faculdade) || (act === 'rel' && !S.rel.some(x => x.id === id)) || (act === 'vender' && !S.bens.some(x => x.id === id))) { render(); return; }
  deltas = {};
  if (act === 'atividade') {
    const a = ATIVIDADES.find(x => x.id === id);
    const c = custoAtividade(a); if (c) grana(-c);
    S.feitosAno['at:' + a.id] = true;
    a.fx();
  } else if (act === 'tratar') {
    S.feitosAno['trat:' + id] = true;
    const d = DOENCAS[id];
    if (S.idade >= 18) grana(-Math.round(preco(d.custo) * (S.plano ? .2 : 1)));
    if (chance(d.cura + (S.plano ? .15 : 0))) { S.doencas = S.doencas.filter(n => n !== id); mod('saude', 8); line(`O tratamento funcionou: você está ${G('curado', 'curada')} de ${id.toLowerCase()}.`, 'good', 'saude'); }
    else line(`O tratamento de ${id.toLowerCase()} não funcionou este ano.`, 'bad', 'saude');
  } else if (act === 'plano') {
    S.plano = !S.plano; line(S.plano ? 'Você contratou um plano de saúde.' : 'Você cancelou o plano de saúde.', '', 'saude');
  } else if (act === 'vaga') candidatar(id);
  else if (act === 'trab') {
    S.feitosAno['trab:' + id] = true;
    ACOES_TRAB[id]();
  } else if (act === 'faculdade') { S.fila.push({ id: 'curso', d: {} }); }
  else if (act === 'trancar') { line(`Você largou a faculdade de ${S.faculdade.curso}.`, '', 'escola'); S.faculdade = null; }
  else if (act === 'rel') {
    const r = S.rel.find(x => x.id === id);
    S.feitosAno[r.id + ':' + b.dataset.acao] = true;
    CUR_CAT = ['parceiro', 'ex'].includes(r.tipo) ? 'amor' : 'familia';
    ACOES_REL.find(a => a.id === b.dataset.acao).fx(r);
    CUR_CAT = null;
  } else if (act === 'procurar') {
    S.feitosAno.procurar = true;
    CUR_CAT = 'amor';
    if (chance(.25 + S.st.aparencia / 200)) conhecerAlguem(pick(['no trabalho', 'pela internet', 'num show', 'na fila do pão']));
    else { mod('felicidade', -2); line('Você tentou, mas ninguém se interessou este ano.'); }
    CUR_CAT = null;
  } else if (act === 'mudar') {
    S.moradia = id;
    if (id === 'aluguel') mod('felicidade', 4);
    line({ aluguel: 'Você alugou um apartamento.', pais: 'Você voltou para a casa dos pais.', propria: 'Você se mudou para o seu imóvel.' }[id], '', 'vida');
  } else if (act === 'comprar') {
    const item = (b.dataset.tipo === 'imovel' ? IMOVEIS : CARROS).find(x => x.id === id);
    const v = preco(item.valor), anos = b.dataset.tipo === 'imovel' ? 30 : 5;
    const bem = { id: uid(), tipo: b.dataset.tipo, nome: item.nome, valor: v, parcela: 0, anos: 0 };
    if (b.dataset.modo === 'vista') grana(-v);
    else { const ent = Math.round(v * .2); grana(-ent); bem.parcela = Math.round((v - ent) * (anos === 30 ? 1.8 : 1.3) / anos); bem.anos = anos; }
    S.bens.push(bem);
    CUR_CAT = 'dinheiro';
    if (bem.tipo === 'imovel') {
      S.moradia = 'propria';
      if (!flag('imovel')) { setFlag('imovel'); marco('Casa própria', `Você comprou: ${item.nome.toLowerCase()}. As chaves são suas.`); }
      else line(`Você comprou: ${item.nome.toLowerCase()}.`, 'good');
    } else { mod('felicidade', 5); line(`Você comprou: ${item.nome.toLowerCase()}.`, 'good'); }
    CUR_CAT = null;
  } else if (act === 'vender') {
    const bem = S.bens.find(x => x.id === id);
    grana(bem.valor - bem.parcela * bem.anos);
    S.bens = S.bens.filter(x => x.id !== id);
    if (bem.tipo === 'imovel' && !S.bens.some(x => x.tipo === 'imovel') && S.moradia === 'propria') S.moradia = 'aluguel';
    line(`Você vendeu: ${bem.nome.toLowerCase()}.`, '', 'dinheiro');
  } else if (act === 'investir') {
    const v = b.dataset.v === 'tudo' ? S.dinheiro : +b.dataset.v;
    grana(-v); S.inv[id] += v;
  } else if (act === 'resgatar') {
    grana(S.inv[id]); S.inv[id] = 0;
  } else if (act === 'som') {
    somLigado = !somLigado; gravarLS(SOM_KEY, somLigado); if (somLigado) som('bom');
  } else if (act === 'novaVida') {
    novaVida({ nome: $('nvNome').value, sexo: $('nvSexo').value, interesse: $('nvInt').value });
    fecharSheet(); window.scrollTo({ top: 0 }); return;
  } else if (act === 'novaVidaRapida') { novaVida({ interesse: S.interesse }); window.scrollTo({ top: 0 }); return; }
  else if (act === 'legado') { novaVidaLegado(id); window.scrollTo({ top: 0 }); return; }
  morteImediata();
  salvar(); render();
});
$('age').addEventListener('click', avancar);
$('sheetClose').addEventListener('click', fecharSheet);
$('scrim').addEventListener('click', fecharSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) fecharSheet(); });

// ================= som, confete e aviso =================
let somLigado = lerLS(SOM_KEY, true);
let AC = null;
function som(tipo) {
  if (!somLigado) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notas = { ano: [[520, .06]], bom: [[660, .08], [880, .1]], ruim: [[300, .12], [220, .16]], marco: [[523, .1], [659, .1], [784, .1], [1046, .22]], conquista: [[784, .08], [1046, .16]] }[tipo];
    let t = AC.currentTime;
    notas.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
      t += d * .9;
    });
  } catch (e) {}
}
function confete() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confete'), ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cores = ['--sun', '--accent', '--c-amor', '--c-saude', '--c-fama'].map(v => cs.getPropertyValue(v).trim() || '#F4B62C');
  const ps = Array.from({ length: 120 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, c: pick(cores), a: Math.random() * 6 }));
  const ini = performance.now();
  (function quadro(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillRect(-4, -2, 8, 4 + p.r); ctx.restore(); });
    if (t - ini < 2200) requestAnimationFrame(quadro); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })(ini);
}
let toastT = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}

// ================= salvar =================
function salvar() { gravarLS(SAVE_KEY, S); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S }));
function start(data) {
  const salvo = (data && data.S) || lerLS(SAVE_KEY, null);
  if (salvo && salvo.versao === 2) { S = salvo; render(); } else novaVida();
}
const hot = window.claude && window.claude.hot;
hot && hot.ready ? hot.ready(start) : start((hot && hot.data) || {});
